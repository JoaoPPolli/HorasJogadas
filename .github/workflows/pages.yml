name: Atualizar página de download
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build_site.py', '.github/workflows/pages.yml', 'scripts/verify_publication.py', 'horas_jogadas_qt/release.py']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify site and public downloads
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/verify_publication.py
      - name: Record verification
        if: always()
        run: |
          if test -f site-verification.json; then
            cp site-verification.json "$RUNNER_TEMP/site-verification.json"
          else
            echo '{"ok":false,"error":"Site verification did not run"}' > "$RUNNER_TEMP/site-verification.json"
          fi
          rm -f site-verification.json
          git fetch origin automation/publication-status
          git switch -C automation/publication-status FETCH_HEAD
          cp "$RUNNER_TEMP/site-verification.json" site-verification.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-verification.json
          git diff --cached --quiet || git commit -m 'Record site and download verification'
          git pull --rebase origin automation/publication-status
          git push origin HEAD:automation/publication-status
