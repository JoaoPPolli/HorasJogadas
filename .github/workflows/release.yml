name: Release Windows, Linux e site
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-qt.txt
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth x11-utils desktop-file-utils libglib2.0-bin libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-keysyms1 libxcb-shape0 libxcb-icccm4
      - name: Dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate tag version
        shell: bash
        run: |
          version=$(python -c 'from horas_jogadas_qt.release import VERSION; print(VERSION)')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then test "$GITHUB_REF_NAME" = "release/v$version"; fi
      - name: Core tests
        run: python scripts/ci_tests.py tests
      - name: Qt and data transition tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/ci_tests.py tests_qt
      - name: Dependency license texts
        shell: bash
        run: |
          mkdir -p build/legal
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pyside/pyside-setup/v6.8.3/LICENSES/LGPL-3.0-only.txt -o build/legal/Qt-PySide-LGPL-3.0.txt
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pyside/pyside-setup/v6.8.3/LICENSES/GPL-3.0-only.txt -o build/legal/Qt-PySide-GPL-3.0.txt
          curl --fail --location --retry 3 https://raw.githubusercontent.com/python/cpython/v3.12.10/LICENSE -o build/legal/Python-LICENSE.txt
          curl --fail --location --retry 3 https://raw.githubusercontent.com/pyinstaller/pyinstaller/v6.16.0/COPYING.txt -o build/legal/PyInstaller-LICENSE.txt
      - name: Evaluate public cover source
        if: runner.os == 'Linux'
        continue-on-error: true
        run: python scripts/probe_artwork_sources.py
      - name: Build and test Windows bundle
        if: runner.os == 'Windows'
        env:
          HORASJOGADAS_NETWORK_SELFTEST: '1'
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_build.py
      - name: Build and test Linux bundle
        if: runner.os == 'Linux'
        env:
          HORASJOGADAS_NETWORK_SELFTEST: '1'
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a python scripts/ci_build.py
      - name: Verify Linux update and actual restart
        if: runner.os == 'Linux'
        run: python scripts/verify_linux_update.py dist/HorasJogadas release/HorasJogadas-Linux-x86_64.tar.gz --result build-diagnostics/linux-update.json
      - name: Verify update on Arch Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/project:ro" -v "$GITHUB_WORKSPACE/build-diagnostics:/diagnostics" -w /project archlinux:base bash -e -c '
            pacman -Syu --noconfirm python libglvnd libxkbcommon fontconfig ttf-dejavu libxrender libxext libx11 libxcb dbus glib2
            python scripts/verify_linux_update.py dist/HorasJogadas release/HorasJogadas-Linux-x86_64.tar.gz --result /diagnostics/linux-arch-update.json
          '
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:HORAS_VERSION = python -c 'from horas_jogadas_qt.release import VERSION; print(VERSION)'
          & $compiler packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer before publication
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p build/installer-check
          cp release/HorasJogadas-Windows-Setup.exe build/installer-check/
          cd build/installer-check
          sha256sum HorasJogadas-Windows-Setup.exe > SHA256SUMS.txt
          cd ../..
          python scripts/verify_installer.py
          cp installer-verification.json build-diagnostics/installer-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.name }}
          path: build-diagnostics/*
          if-no-files-found: ignore
  phone-browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phone control dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements-qt.txt
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real phone browser and desktop integration
        run: node scripts/verify_phone_browser.cjs --python python --result build-diagnostics/phone-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-phone-browser
          path: build-diagnostics/*
          if-no-files-found: ignore
  publish:
    needs: [build, phone-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: |
          cd release
          sha256sum HorasJogadas-Windows-Setup.exe HorasJogadas-Windows-Portable.zip HorasJogadas-Linux-x86_64.tar.gz > SHA256SUMS.txt
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'from horas_jogadas_qt.release import VERSION; print(VERSION)')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release $tag já existe. Crie uma nova versão para preservar os downloads publicados." >&2
            exit 1
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "HorasJogadas $version" --notes-file packaging/RELEASE_NOTES.md --latest
          fi
          echo "release_url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"
  status:
    if: always()
    needs: [build, phone-browser, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: diagnostics-*
          merge-multiple: true
          path: build-diagnostics
      - name: Collect job outcomes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build-diagnostics
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | {name,conclusion,steps:[.steps[]|{name,conclusion}]}]' > build-diagnostics/jobs.json
      - name: Collect result
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PAGES_RESULT: separate-workflow
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          SITE_URL: https://joaoppolli.github.io/HorasJogadas/
          STATUS_FILE: ${{ runner.temp }}/publication-status.json
        run: python scripts/record_publication_status.py
      - uses: actions/checkout@v4
        with:
          path: .publication-status
      - name: Persist publication result
        working-directory: .publication-status
        run: |
          git fetch origin automation/publication-status
          git switch -C automation/publication-status FETCH_HEAD
          cp "$RUNNER_TEMP/publication-status.json" status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status.json
          git diff --cached --quiet || git commit -m 'Record release and Pages result'
          git pull --rebase origin automation/publication-status
          git push origin HEAD:automation/publication-status
